<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — NovaCart</title><link rel="stylesheet" href="styles.css"></head><body class="admin-page">
<header class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Nova<span>Cart</span></span></a><div><span id="adminName"></span><button class="outline" onclick="logout()">Logout</button></div></header>
<div class="admin-shell"><aside class="admin-side"><button class="side active" data-tab="overview">▦ Overview</button><button class="side" data-tab="products">▤ Products</button><button class="side" data-tab="orders">▣ Orders</button><button class="side" data-tab="users">♙ Users</button></aside>
<main class="admin-main">
<section id="overview" class="admin-tab"><div class="admin-title"><div><small>STORE CONTROL</small><h1>Dashboard</h1></div></div><div class="stats"><div><span>Products</span><strong id="statProducts">0</strong></div><div><span>Users</span><strong id="statUsers">0</strong></div><div><span>Orders</span><strong id="statOrders">0</strong></div><div><span>Revenue</span><strong id="statRevenue">₹0</strong></div></div><div class="admin-panel"><h2>Quick actions</h2><div class="quick"><button onclick="openProductForm()">＋ Add product</button><button onclick="showTab('orders')">View orders</button><button onclick="showTab('users')">View users</button></div></div></section>
<section id="products" class="admin-tab hidden"><div class="admin-title"><div><small>CATALOG</small><h1>Products</h1></div><button class="primary" onclick="openProductForm()">＋ Add product</button></div><div class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Actions</th></tr></thead><tbody id="productTable"></tbody></table></div></div></section>
<section id="orders" class="admin-tab hidden"><div class="admin-title"><div><small>FULFILMENT</small><h1>Orders</h1></div></div><div class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Update</th></tr></thead><tbody id="orderTable"></tbody></table></div></div></section>
<section id="users" class="admin-tab hidden"><div class="admin-title"><div><small>CUSTOMERS</small><h1>Users</h1></div></div><div class="admin-panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody id="userTable"></tbody></table></div></div></section>
</main></div>
<div id="productModal" class="modal"><div class="modal-card wide"><button class="modal-close" onclick="closeProductForm()">×</button><h2 id="productFormTitle">Add product</h2><form id="productForm"><input type="hidden" name="id"><div class="two"><input name="title" placeholder="Product title" required><select name="category_slug" id="pCategory" required></select></div><textarea name="description" placeholder="Description" required></textarea><div class="three"><input name="price" type="number" placeholder="Price" required><input name="old_price" type="number" placeholder="Old price" required><input name="discount" type="number" placeholder="Discount %" required></div><div class="three"><input name="stock" type="number" placeholder="Stock" required><input name="rating" type="number" step=".1" min="0" max="5" placeholder="Rating" required><input name="reviews" type="number" placeholder="Reviews" required></div><input name="image" placeholder="Image URL"><label class="check"><input name="featured" type="checkbox"> Featured product</label><button class="primary full">Save product</button></form></div></div>
<script src="admin.js"></script></body></html>
