<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — NovaCart</title><link rel="stylesheet" href="styles.css"></head><body class="auth-page">
<div class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">N</span><span>Nova<span>Cart</span></span></a>
<div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div>
<form id="loginForm"><h1>Welcome back</h1><p class="muted">Sign in to continue shopping.</p><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password" required><button class="primary full">Sign in</button><div id="loginMsg" class="form-msg"></div></form>
<form id="registerForm" class="hidden"><h1>Create your account</h1><p class="muted">Join NovaCart and manage your orders easily.</p><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password (6+ characters)" required><button class="primary full">Create account</button><div id="registerMsg" class="form-msg"></div></form>
<div class="demo-login">Demo admin: <b>admin@store.local</b> / <b>Admin@123</b></div></div></div><script src="auth.js"></script></body></html>
